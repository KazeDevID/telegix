name: Publish to npm on Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Diperlukan untuk npm provenance

jobs:
  check-and-publish:
    # Hanya jalan jika PR di-merge, atau push langsung ke main/master, atau manual trigger
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Check if package.json version is updated
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Package: $PACKAGE_NAME"
          echo "Local version in package.json: $LOCAL_VERSION"
          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          # Cek versi yang sudah dirilis di registry npmjs
          NPM_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "none")
          echo "Latest version on npm registry: $NPM_VERSION"

          # Jika versi lokal berbeda dengan yang ada di npm, lakukan publish
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "🚀 New version detected ($NPM_VERSION -> $LOCAL_VERSION). Proceeding to publish!"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ Version $LOCAL_VERSION is already published on npm. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci || npm install

      - name: Run linter / typecheck
        if: steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run lint

      - name: Run test suite
        if: steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm test

      - name: Build CommonJS bundle
        if: steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build:cjs

      - name: Publish to npm
        if: steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git Tag
        if: (steps.check_version.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch') && success()
        run: |
          VERSION="v${{ steps.check_version.outputs.local_version }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "✅ Created and pushed tag $VERSION"
          else
            echo "Tag $VERSION already exists."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
